name: Prepare Wails release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
  draft-release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: titan-windows-amd64
          path: artifacts
      - name: Create checksums
        working-directory: artifacts
        run: sha256sum *.exe > SHA256SUMS.txt
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          args=(--draft --verify-tag --generate-notes --title "Titan $RELEASE_TAG")
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" artifacts/* "${args[@]}"
